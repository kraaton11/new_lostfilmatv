name: release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Generate version metadata
        id: version
        shell: bash
        run: |
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="v$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: >
          ./gradlew assembleRelease
          -PreleaseVersionCode=${{ steps.version.outputs.version_code }}
          -PreleaseVersionName=${{ steps.version.outputs.version_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Постоянная часть описания: то, что человеку нужно знать перед
          # установкой. Список изменений ниже добавляется автоматически из
          # смерженных PR и коммитов, поэтому руками его вести не нужно.
          NOTES="$(cat <<'HEADER'
          ## Перед установкой

          **Обновите auth-bridge на сервере.** Подбор постеров и описаний ходит
          в TMDB через ваш бэкенд, и он должен пропускать параметр `page` при
          поиске: без него доступны только первые 20 результатов выдачи, и часть
          карточек останется без обложки.

          **TorrServe.** Воспроизведение требует либо адреса на этом же ТВ по
          `127.0.0.1`, либо HTTPS. cleartext для произвольных адресов не
          разрешён: `network-security-config` не умеет задавать диапазоны IP, и
          статический конфиг заблокировал бы TorrServe в локальной сети.

          **Другой адрес LostFilm** задаётся в настройках, секция «Сервер».
          Поддерживается только HTTPS, по умолчанию поведение прежнее.
          HEADER
          )"

          gh release create "${{ steps.version.outputs.version_name }}" \
            app/build/outputs/apk/release/*.apk \
            --title "${{ steps.version.outputs.version_name }}" \
            --target "$GITHUB_SHA" \
            --notes "$NOTES" \
            --generate-notes
