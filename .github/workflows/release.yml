name: release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Generate version metadata
        id: version
        shell: bash
        run: |
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="v$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: >
          ./gradlew assembleRelease
          -PreleaseVersionCode=${{ steps.version.outputs.version_code }}
          -PreleaseVersionName=${{ steps.version.outputs.version_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null || true)"
          revision_range="$GITHUB_SHA"
          if [[ -n "$previous_tag" ]]; then
            revision_range="$previous_tag..$GITHUB_SHA"
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf '## Что изменилось\n\n'
            git log --no-merges --format='- %s (%h)' "$revision_range"
            if [[ -n "$previous_tag" ]]; then
              printf '\n[Полный список изменений](%s/%s/compare/%s...%s)\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous_tag" "$GITHUB_SHA"
            fi
          } > "$notes_file"

          gh release create "${{ steps.version.outputs.version_name }}" \
            app/build/outputs/apk/release/*.apk \
            --title "${{ steps.version.outputs.version_name }}" \
            --target "$GITHUB_SHA" \
            --notes-file "$notes_file"
